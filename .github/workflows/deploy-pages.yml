name: Deploy public Pages site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "CNAME"
      - "CRUMB_PROTOCOL.md"
      - "WHOLE_DONUTS_GUIDE.md"
      - "RELEASE_NOTES.md"
      - "app.js"
      - "auth-config.js"
      - "auth.js"
      - "guide.html"
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "storefront-config.js"
      - "styles.css"
      - "templates/**"
      - "world/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        run: |
          mkdir -p _site/world _site/templates
          cp index.html guide.html styles.css app.js auth-config.js auth.js storefront-config.js robots.txt sitemap.xml CNAME _site/
          cp CRUMB_PROTOCOL.md WHOLE_DONUTS_GUIDE.md RELEASE_NOTES.md _site/
          cp world/index.html world/script.js world/styles.css _site/world/
          cp templates/*.md _site/templates/
          printf '%s\n' "$GITHUB_SHA" > _site/deploy-version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..40}; do
            live_sha="$(curl --fail --silent --show-error --location "$PAGE_URL/deploy-version.txt" | tr -d '\r\n' || true)"
            if [[ "$live_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not serve the deployed revision: $EXPECTED_SHA" >&2
          exit 1
