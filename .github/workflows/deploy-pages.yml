name: Deploy public Pages site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate public invitation protocol
        run: |
          node --check app.js
          node --check campaign-protocol.js
          node --test tests/campaign-protocol.test.js

      - name: Stage public site
        run: |
          mkdir -p _site/world _site/templates
          cp index.html guide.html ecosystem.html course.html course.js styles.css app.js campaign-protocol.js review-queue-manifest.js storefront-config.js robots.txt sitemap.xml CNAME _site/
          cp CRUMB_PROTOCOL.md WHOLE_DONUTS_GUIDE.md PUBLIC_SYSTEM.md RELEASE_NOTES.md _site/
          cp world/index.html world/script.js world/styles.css _site/world/
          cp templates/*.md _site/templates/
          printf '%s\n' "$GITHUB_SHA" > _site/deploy-version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..40}; do
            live_sha="$(curl --fail --silent --show-error --location "$PAGE_URL/deploy-version.txt" | tr -d '\r\n' || true)"
            if [[ "$live_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not serve the deployed revision: $EXPECTED_SHA" >&2
          exit 1
